services:
  investclosure:
    build: .
    container_name: investclosure
    ports:
      - "5001:5001"
    env_file: .env
    volumes:
      - ./data:/app/data
      - ./reports:/app/reports
      - ./scraper:/app/scraper
      - ./templates:/app/templates
      - ./static:/app/static
    depends_on:
      - flaresolverr
    restart: unless-stopped
    environment:
      # Run the scheduled scraper loop inside the container (default true)
      RUN_CRON: "true"
      # Scheduled scrapes at 4:00 AM and 4:00 PM America/New_York (12h apart)
      CRON_HOURS: "4,16"
      # Interval is kept for CLI compatibility; schedule is driven by CRON_HOURS
      SCRAPE_INTERVAL: 720

  flaresolverr:
    image: ghcr.io/flaresolverr/flaresolverr:latest
    container_name: flaresolverr
    ports:
      - "8191:8191"
    environment:
      - LOG_LEVEL=info
      - LOG_HTML=false
      - TZ=UTC
    restart: unless-stopped
